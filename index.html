<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduino USB / Bluetooth — Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --green: #34d399;
      --red: #f87171;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      padding: 1rem;
    }
    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.4rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status.connected .dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    button {
      flex: 1;
      min-width: 130px;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #0b1220;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #334155; color: var(--text); }
    .send {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0b1220;
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .log {
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 10px;
      height: 220px;
      overflow-y: auto;
      padding: 0.75rem;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      color: var(--text);
    }
    .log > div { min-height: 1.5em; }
    .log .in { color: var(--green); }
    .log .out { color: var(--accent); }
    .log .sys { color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <h1>Arduino USB / Bluetooth</h1>
    <p class="sub">Demo de la clase ArduinoUSB con Web Serial y Web Bluetooth</p>

    <div class="status" id="status">
      <span class="dot"></span>
      <span id="status-text">Desconectado</span>
    </div>

    <div class="row">
      <button id="btn-usb">Conectar por USB</button>
      <button id="btn-bt">Conectar por Bluetooth</button>
      <button id="btn-disc" class="secondary" disabled>Desconectar</button>
    </div>

    <div class="send">
      <input id="msg" type="text" placeholder="Escribe un comando…" />
      <button id="btn-send" class="secondary" disabled>Enviar</button>
    </div>

    <div class="log" id="log"></div>
  </div>

  <script type="module">
    import ArduinoUSB from './arduino-usb.js';

    const $ = (id) => document.getElementById(id);
    const status = $('status');
    const statusText = $('status-text');
    const log = $('log');
    const btnUsb = $('btn-usb');
    const btnBt = $('btn-bt');
    const btnDisc = $('btn-disc');
    const btnSend = $('btn-send');
    const msg = $('msg');

    const arduino = new ArduinoUSB({ baudRate: 9600 });

    let currentLine = null;

    function newLine(cls = 'sys') {
      currentLine = document.createElement('div');
      currentLine.className = cls;
      log.appendChild(currentLine);
      return currentLine;
    }

    function logLine(text, cls = 'sys') {
      const line = newLine(cls);
      line.textContent = text;
      currentLine = null;
      log.scrollTop = log.scrollHeight;
    }

    // El puerto serie entrega los datos en trozos arbitrarios, no línea a línea.
    // Acumulamos esos trozos en la línea en curso y solo cortamos con '\n'.
    function logData(text, cls = 'in') {
      const parts = String(text).replace(/\r/g, '').split('\n');

      for (let i = 0; i < parts.length; i++) {
        const isLast = i === parts.length - 1;

        if (isLast && parts[i] === '') {
          // Nada pendiente tras el último salto de línea.
          if (i === 0) break; // el trozo era solo '\n'
          currentLine = null;
          break;
        }

        if (!currentLine) newLine(cls);
        currentLine.textContent += parts[i];

        if (!isLast) currentLine = null; // el siguiente trozo empieza línea nueva
      }

      log.scrollTop = log.scrollHeight;
    }

    function setConnected(state, transport = '') {
      status.classList.toggle('connected', state);
      statusText.textContent = state ? `Conectado (${transport})` : 'Desconectado';
      btnDisc.disabled = !state;
      btnSend.disabled = !state;
      btnUsb.disabled = state;
      btnBt.disabled = state;
    }

    // Soporte del navegador
    if (!arduino.usbSupported) logLine('⚠ Web Serial no soportado en este navegador.');
    if (!arduino.bluetoothSupported) logLine('⚠ Web Bluetooth no soportado en este navegador.');

    // Eventos
    arduino.addEventListener('connect', (e) => {
      const t = e.detail.transport;
      currentLine = null;
      logLine(`✔ Conectado por ${t}`, 'sys');
      setConnected(true, t);
    });

    arduino.addEventListener('data', (e) => {
      logData(e.detail, 'in');
    });

    arduino.addEventListener('disconnect', (e) => {
      logLine(`✖ Desconectado${e.detail.reason ? ' (' + e.detail.reason + ')' : ''}`, 'sys');
      currentLine = null;
      setConnected(false);
    });

    arduino.addEventListener('error', (e) => {
      logLine('✖ Error: ' + (e.detail.message || e.detail), 'sys');
    });

    // Acciones
    btnUsb.addEventListener('click', async () => {
      try {
        await arduino.connectUSB({ baudRate: 9600 });
      } catch (err) {
        logLine('✖ ' + err.message, 'sys');
      }
    });

    btnBt.addEventListener('click', async () => {
      try {
        // Ajusta el prefijo/nombre a tu módulo (HM-10, HC-08, etc.)
        await arduino.connectBluetooth({ namePrefix: 'HM' });
      } catch (err) {
        logLine('✖ ' + err.message, 'sys');
      }
    });

    btnDisc.addEventListener('click', () => arduino.disconnect());

    btnSend.addEventListener('click', async () => {
      const text = msg.value;
      if (!text) return;
      try {
        await arduino.sendLine(text);
        logLine(text, 'out');
      } catch (err) {
        logLine('✖ ' + err.message, 'sys');
      }
    });

    msg.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnSend.click();
    });
  </script>
</body>
</html>
